# Recording profile: preserve the full 50 Hz encoder/controller telemetry rate.
channels:
  - id: 1
    topic: /enc/frame
    type: sensor_msgs/msg/Image
    max_rate_hz: 50.0
    priority: 2

  - id: 2
    topic: /enc/tokens
    type: vision_encoders/msg/ImageTokens
    max_rate_hz: 50.0
    priority: 4

  - id: 3
    topic: /vibe/sonic/attention_mask
    type: std_msgs/msg/Float32MultiArray
    max_rate_hz: 50.0
    priority: 1

  # Debug-rate robot telemetry. The source topics may run faster; the bridge's
  # latest-only slots cap both streams without building a queue onboard.
  - id: 4
    topic: /lowstate
    type: unitree_hg/msg/LowState
    max_rate_hz: 50.0
    priority: 5

  - id: 5
    topic: /lowcmd
    type: unitree_hg/msg/LowCmd
    max_rate_hz: 50.0
    priority: 6

  # the planner, the retrieval planner. Carried by full and light alike, and silent
  # unless a planner is running: three latest-only slots, a subscription each, so
  # the offboard viewer and the bag carry the planner's state without anyone
  # having to remember to select a different profile. Priority 3 because the
  # payloads are tens of bytes and each one is a whole decision — a dropped
  # PlannerStatus is a missing frame in the story, not a stale sample.
  - id: 6
    topic: /vibe/planner/status
    type: sledgehammer/msg/PlannerStatus
    max_rate_hz: 50.0
    priority: 3

  - id: 7
    topic: /vibe/controller/status
    type: cpp_control/msg/ControllerStatus
    max_rate_hz: 50.0
    priority: 7

  - id: 8
    topic: /vibe/sonic/goal_color
    type: std_msgs/msg/Int32
    max_rate_hz: 50.0
    priority: 7
