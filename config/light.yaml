# Viewer profile: latest samples only, capped to keep Wi-Fi and Orin work small.
channels:
  - id: 1
    topic: /enc/frame
    type: sensor_msgs/msg/Image
    max_rate_hz: 10.0
    priority: 2

  - id: 2
    topic: /enc/tokens
    type: vision_encoders/msg/ImageTokens
    max_rate_hz: 10.0
    priority: 4

  - id: 3
    topic: /vibe/sonic/attention_mask
    type: std_msgs/msg/Float32MultiArray
    max_rate_hz: 10.0
    priority: 1

  # the planner's state. Ids match full.yaml so the two profiles never disagree about
  # what a channel number means; see full.yaml for why these are always here.
  - id: 6
    topic: /vibe/planner/status
    type: cpp_control/msg/PlannerStatus
    max_rate_hz: 10.0
    priority: 3

  - id: 7
    topic: /vibe/controller/status
    type: cpp_control/msg/ControllerStatus
    max_rate_hz: 10.0
    priority: 7

  - id: 8
    topic: /vibe/sonic/goal_color
    type: std_msgs/msg/Int32
    max_rate_hz: 10.0
    priority: 7
