/enc/frame:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/enc/tokens:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/vibe/sonic/attention_mask:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/lowstate:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/lowcmd:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

# sys1. Deeper history because these are event-driven and sparse — one sample
# is one decision, and the recorder must not miss it while it flushes a frame.
/vibe/sys1/status:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 50

/vibe/sys0/status:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/vibe/sonic/goal_color:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 50

# Sys1 observation calibration. RGB-D and diagnostics are one logical sample;
# each source publisher is latest-only/best-effort, matching the bridge.
/vibe/sys1/observe/color/compressed:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/vibe/sys1/observe/depth:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/vibe/sys1/observe/camera_info:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/vibe/sys1/observe/labels:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/vibe/sys1/observe/observation:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 50

/vibe/sys1/calibration/state:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 50

# The viewer republishes exactly one reliable RGB-D bundle per LT/Space click.
/vibe/sys1/calibration/color/compressed:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 50

/vibe/sys1/calibration/depth:
